[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "nmdc-ai-eval"
description = "Framework and data for performing evaluations for AI-powered NMDC tools."
authors = [
  {name = "Harry Caufield", email = "jhc@lbl.gov"},
  {name = "Mark Andrew Miller", email = "MAM@lbl.gov"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dynamic = ["version"]

dependencies = [
  "anthropic[vertex]>=0.84",
  "click>=8.3.3",
  "google-genai>=1.0",
  "ipython>=9.10.0",
  "llm-claude-3>=0.11",
  "llm-gemini>=0.29",
  "llm-matrix>=0.1.3",
  "oaklib>=0.6.0",
  "openai>=1.0",
  "pandas>=2.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
  "pre-commit>=3.3",
  "mypy>=1.19.1",
  "deptry>=0.24.0",
  "pip-audit>=2.10.0",
  "pytest-cov>=7.0.0",
  "pandas-stubs>=3.0.0.260204",
  # Resolved from the suggestor's git main, not from PyPI. Its newest release
  # is 1.2.1 (2026-06-24) and main is ~145 commits ahead, so resolving from
  # PyPI scored a June single-pass pipeline and none of the agentic work.
  # Tracking the branch rather than pinning `rev` is deliberate: uv.lock still
  # records the exact resolved SHA, so a run stays attributable, while
  # `uv lock --upgrade` can advance it. An explicit `rev` is immutable and
  # --upgrade will not move it, which would freeze the staleness at a new SHA.
  "nmdc-metadata-suggestor-ai-tool",
  "nmdc-api-utilities>=0.6.1",
  "pymongo>=4.16.0",
  "types-pyyaml>=6.0.12.20250915",
]

[project.entry-points."llm"]
vertex = "nmdc_ai_eval.llm_plugin_vertex"

[tool.hatch.build.targets.wheel]
packages = ["src/nmdc_ai_eval"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv]
constraint-dependencies = [
  "anthropic>=0.84.0",    # llm-claude-3 runtime dep
  "linkml>=1.10.0",       # linkml <1.10 references Format.JSON removed in linkml-runtime 1.10
  "setuptools>=83.0.0",   # oaklib/eutils no longer need pkg_resources as of eutils 0.6.1; >=83.0.0 is the first release fixing PYSEC-2026-3447 (verified 2026-07-20)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --durations=5"
filterwarnings = [
  "ignore::DeprecationWarning:sssom_schema",
  "ignore::pandas.errors.Pandas4Warning:sssom",
]
markers = ["api: tests requiring LLM API calls (excluded from CI)"]

[tool.coverage.run]
omit = [
  "src/nmdc_ai_eval/run_suite.py",  # API-only; untestable without live LLM calls
]

[tool.coverage.report]
exclude_lines = [
  # Vertex plugin execute() methods require live SA creds — excluded by pattern,
  # not whole-file, so register_models() and _get_vertex_project() stay covered.
  "^\\s*def execute\\(",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "W",   # pycodestyle warnings
  "B",   # bugbear
  "S",   # bandit (security)
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # assert, subprocess in tests
"datasets/**" = ["S311"]  # pseudo-random OK for sampling eval data

[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "datasets/*",
]
quiet-level = 3

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "nmdc_metadata_suggestor_ai_tool.*"
ignore_missing_imports = true

[tool.deptry]
per_rule_ignores = {DEP002 = ["ipython", "llm-claude-3", "llm-gemini", "pyyaml"], DEP003 = ["llm"], DEP004 = ["nmdc_metadata_suggestor_ai_tool"]}

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "datasets/*",
]

[tool.uv.sources]
nmdc-metadata-suggestor-ai-tool = { git = "https://github.com/microbiomedata/nmdc-metadata-suggestor-ai-tool.git", branch = "main" }
