name: nmdc-field-guidance
description: Predict which biosample slots should be filled, given submission-level metadata. Uses the production suggestor's
  system prompt and schema context. Ground truth from Montana Smith and Bea Meluch (microbiomedata/issues#1551).
template: predict_slots
templates:
  predict_slots:
    system: "\nYou are an assistant for suggesting metadata for a scientific submission to the NMDC data portal. You will\
      \ be provided with the following information:\n- An abstract of a scientific publication (if available)\n- A list of\
      \ PDF files associated with the publication (if available)\n- Any additional information that may be relevant for suggesting\
      \ metadata\n\nUse this information to suggest metadata fields for the submission. \nThe metadata fields must only be\
      \ chosen from the NMDC schema.\nYou also need to output a short sentence on the reason for choosing each metadata field,\
      \ based on the information provided.\n\nYou should output ONLY THE CHOSEN METADATA FIELDS and the REASON in a JSON list\
      \ format.\nDo not include any explanations or additional text.\nThe metadata fields should be relevant to the content\
      \ of the abstract and the information provided.\n\nVALUE FIELD RULES:\n- Only fill in the \"value\" field if you are\
      \ certain of the specific value for that metadata field based on the provided information.\n- If you are not certain\
      \ of the specific value for a metadata field, leave the field an empty string (\"\")\n- The followng fields MUST have\
      \ a value filled in and be chosen each time:\n    - \"env_broad_scale\"\n    - \"env_local_scale\"\n    - \"env_medium\"\
      \n    - the value of these fields should be chosen from the enumerations in the NMDC schema and be based on the content\
      \ of the abstract and information provided.\n\nOutput schema:\n```json\n{\n    \"metadata_fields\": [\n        {\n \
      \           \"field_name\": \"field_name_1\",\n            \"reason\": \"Reason for choosing this field based on the\
      \ provided information.\",\n            \"value\": \"\"\n        },\n        {\n            \"field_name\": \"field_name_2\"\
      ,\n            \"reason\": \"Reason for choosing this field based on the provided information.\",\n            \"value\"\
      : \"\"\n        },\n        {\n            \"field_name\": \"field_name_3\",\n            \"reason\": \"Reason for choosing\
      \ this field based on the provided information.\",\n            \"value\": \"\"\n        }\n        // ... more fields\
      \ as applicable\n    ]\n}\n```\n"
    prompt: '{input}'
    metrics:
    - simple_question
matrix:
  hyperparameters:
    model:
    - gpt-4o-mini
    - gpt-4o
    - anthropic/claude-sonnet-4-5
    - anthropic/claude-haiku-4-5-20251001
    - gemini/gemini-2.5-flash
    temperature:
    - 0.0
cases:
- input: "Submission description: Yield of the perennial grass Miscanthus × giganteus has shown an inconsistent and unpredictable\
    \ response to nitrogen (N) fertilizer, yet fertilization underpins the crop’s environmental and economic sustainability.\
    \ The interactions among soil microbial communities, N availability, and Miscanthus × giganteus and management may explain\
    \ changes in plant productivity. In this study, soil samples from different stand ages of Miscanthus × giganteus in a\
    \ replicated chronosequence field trial were used to investigate the effects of stand age and N fertilizer rates on microbial\
    \ community structure. We hypothesized that there is a definable Miscanthus × giganteus soil microbiome and that this\
    \ community varies significantly with stand age and fertilization. Our results showed that the main phyla in soil microbial\
    \ communities, regardless of plant age, are similar but microbial community structures are significantly different. The\
    \ variation in observed microbial communities generally decreases with older stand ages. The amount of N fertilizer applied\
    \ also affected the microbial community structure associated with different aged Miscanthus × giganteus. Specifically,\
    \ the relative abundance of Proteobacteria (Alphaproteobacteria and Gammaproteobacteria) and Acidobacteria (subgroup Gp1)\
    \ increased shortly after fertilization and was more associated with younger Miscanthus × giganteus. Furthermore, our\
    \ results show a significant relationship between bacterial α diversity and fertilization rates and that this response\
    \ is also affected by stand age. Overall, our results emphasize linkages between microbial community structure, plant\
    \ age, and fertilization in Miscanthus × giganteus.\nNotes: \nStudy name: AI Example: The Impact of Stand Age and Fertilization\
    \ on the Soil Microbiome of Miscanthus × giganteus\nProtocol descriptions: \nProtocol names: \n\n--- NMDC Schema Context\
    \ ---\n# SoilInterface\n\nsoil dh_interface\n\nTotal fields: 100 | \nRequired: 3 | \nRecommended: 20 | \nAncestors: DhMultiviewCommonColumnsMixin,\
    \ SampIdNewTermsMixin, SoilMixsInspiredMixin, DhInterface\n\n## mixs_inspired_section\n- **ammonium_nitrogen**\n  Concentration\
    \ of ammonium nitrogen in the sample\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+ +(\\[ppm\\]|mg/kg|mg/L)$`)\n-\
    \ **bulk_elect_conductivity**\n  Electrical conductivity is a measure of the ability to carry electric current, which\
    \ is mostly dictated by the chemistry of and amount of water.\n  (type: float)\n- **collection_time** [recommended]\n\
    \  The time of sampling, either as an instance (single point) or interval.\n  (type: string, pattern: `^([01]?\\d|2[0-3]|24(?=:00?:00?$)):([0-5]\\\
    d)(:([0-5]\\d))?$`)\n- **collection_time_inc** [recommended]\n  Time the incubation was harvested/collected/ended. Only\
    \ relevant for incubation samples.\n  (type: string, pattern: `^([01]?\\d|2[0-3]|24(?=:00?:00?$)):([0-5]\\d)(:([0-5]\\\
    d))?$`)\n- **experimental_factor_other** [recommended]\n  Other details about your sample that you feel can't be accurately\
    \ represented in the available columns.\n  (type: string)\n- **filter_method** [recommended]\n  Type of filter used or\
    \ how the sample was filtered\n  (type: string)\n- **infiltrations**\n  The amount of time it takes to complete each infiltration\
    \ activity\n  (type: string, pattern: `^(?:(?:[0-9]|[1-9][0-9]|9[0-9]|0[0-9]|0[0-5][0-9]):[0-5][0-9]:[0-5][0-9])(?:;(?:[0-9]|[1-9][0-9]|9[0-9]|0[0-9]|0[0-5][0-9]):[0-5][0-9]:[0-5][0-9])*$`)\n\
    - **isotope_exposure** [recommended]\n  List isotope exposure or addition applied to your sample.\n  (type: string)\n\
    - **lbc_thirty**\n  lime buffer capacity, determined after 30 minute incubation\n  (type: float)\n- **lbceq**\n  lime\
    \ buffer capacity, determined at equilibrium after 5 day incubation\n  (type: float)\n- **manganese**\n  Concentration\
    \ of manganese in the sample\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+ +(\\[ppm\\]|mg/kg|mg/L)$`)\n- **micro_biomass_c_meth**\
    \ [recommended]\n  Reference or method used in determining microbial biomass carbon\n  (type: string)\n- **micro_biomass_n_meth**\n\
    \  Reference or method used in determining microbial biomass nitrogen\n  (type: string)\n- **microbial_biomass_c**\n \
    \ The part of the organic matter in the soil that constitutes living microorganisms smaller than 5-10 micrometer.\n  (type:\
    \ string, pattern: `^[-+]?[0-9]*\\.?[0-9]+ .*$`)\n- **microbial_biomass_n**\n  The part of the organic matter in the soil\
    \ that constitutes living microorganisms smaller than 5-10 micrometer.\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+\
    \ .*$`)\n- **nitrate_nitrogen**\n  Concentration of nitrate nitrogen in the sample\n  (type: string, pattern: `^[-+]?[0-9]*\\\
    .?[0-9]+ +(\\[ppm\\]|mg/kg|mg/L)$`)\n- **nitrite_nitrogen**\n  Concentration of nitrite nitrogen in the sample\n  (type:\
    \ string, pattern: `^[-+]?[0-9]*\\.?[0-9]+ +(\\[ppm\\]|mg/kg|mg/L)$`)\n- **non_microb_biomass**\n  Amount of biomass;\
    \ should include the name for the part of biomass measured, e.g.insect, plant, total. Can include multiple measurements\
    \ separated by ;\n  (type: string, pattern: `^([^;\\t\\r\\x0A]+;[-+]?[0-9]*\\.?[0-9]+([eE][-+]?[0-9]+)? [^;\\t\\r\\x0A]+\\\
    |)*([^;\\t\\r\\x0A]+;[-+]?[0-9]*\\.?[0-9]+([eE][-+]?[0-9]+)? [^;\\t\\r\\x0A]+)$`)\n- **non_microb_biomass_method**\n \
    \ Reference or method used in determining biomass\n  (type: string)\n- **org_nitro_method**\n  Method used for obtaining\
    \ organic nitrogen\n  (type: string)\n- **other_treatment** [recommended]\n  Other treatments applied to your samples\
    \ that are not applicable to the provided fields\n  (type: string)\n- **start_date_inc** [recommended]\n  Date the incubation\
    \ was started. Only relevant for incubation samples.\n  (type: string, pattern: `^[12]\\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\\\
    d|3[01]))?)?$`)\n- **start_time_inc** [recommended]\n  Time the incubation was started. Only relevant for incubation samples.\n\
    \  (type: string, pattern: `^([01]?\\d|2[0-3]|24(?=:00?:00?$)):([0-5]\\d)(:([0-5]\\d))?$`)\n- **zinc**\n  Concentration\
    \ of zinc in the sample\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+ +(\\[ppm\\]|mg/kg|mg/L)$`)\n\n## mixs_modified_section\n\
    - **air_temp_regm** [recommended]\n  Information about treatment involving an exposure to varying temperatures; should\
    \ include the temperature, treatment regimen including how many times the treatment was repeated, how long each treatment\
    \ lasted, and the start and end time of the entire treatment; can include different temperature regimens\n  (type: string)\n\
    - **biotic_regm** [recommended]\n  Information about treatment(s) involving use of biotic factors, such as bacteria, viruses\
    \ or fungi\n  (type: string)\n- **biotic_relationship**\n  Description of relationship(s) between the subject organism\
    \ and other organism(s) it is associated with. E.g., parasite on species X; mutualist with species Y. The target organism\
    \ is the subject of the relationship, and the other organism(s) is the object\n  (type: BioticRelationshipEnum)\n  Allowed\
    \ values: commensalism, free living, mutualism, parasitism, symbiotic\n- **chem_administration** [recommended]\n  List\
    \ of chemical compounds administered to the host or site where sampling occurred, and when (e.g. Antibiotics, n fertilizer,\
    \ air filter); can include multiple compounds. For chemical entities of biological interest ontology (chebi) (v 163),\
    \ http://purl.bioontology.org/ontology/chebi\n  (type: string, pattern: `^(\\S+.*\\S+ \\[[A-za-z]+:\\d+\\];[12]\\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\\\
    d|3[01]))?)?\\|)*(\\S+.*\\S+ \\[[A-za-z]+:\\d+\\];[12]\\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\\d|3[01]))?)?)$`)\n\
    - **gaseous_environment** [recommended]\n  Use of conditions with differing gaseous environments; should include the name\
    \ of gaseous compound, amount administered, treatment duration, interval and total experimental duration; can include\
    \ multiple gaseous environment regimens\n  (type: string)\n- **humidity_regm** [recommended]\n  Information about treatment\
    \ involving an exposure to varying degree of humidity; information about treatment involving use of growth hormones; should\
    \ include amount of humidity administered, treatment regimen including how many times the treatment was repeated, how\
    \ long each treatment lasted, and the start and end time of the entire treatment; can include multiple regimens\n  (type:\
    \ string)\n- **light_regm** [recommended]\n  Information about treatment(s) involving exposure to light, including both\
    \ light intensity and quality\n  (type: string)\n- **ph** [recommended]\n  pH measurement of the sample, or liquid portion\
    \ of sample, or aqueous phase of the fluid\n  (type: float, min: 0, max: 14)\n- **samp_collec_device** [recommended]\n\
    \  The device used to collect an environmental sample. This field accepts terms listed under environmental sampling device\
    \ (http://purl.obolibrary.org/obo/ENVO). This field also accepts terms listed under specimen collection device (http://purl.obolibrary.org/obo/GENEPIO_0002094)\n\
    \  (type: string)\n- **samp_collec_method**\n  The method employed for collecting the sample\n  (type: string)\n- **samp_mat_process**\n\
    \  A brief description of any processing applied to the sample during or after retrieving the sample from environment,\
    \ or a link to the relevant protocol(s) performed\n  (type: string)\n- **samp_size**\n  The total amount (volume or mass)\
    \ of sample collected.\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)?\
    \ *.*$`)\n- **sieving** [recommended]\n  Collection design of pooled samples and/or sieve size and amount of sample sieved\n\
    \  (type: string)\n- **size_frac_low**\n  Refers to the mesh/pore size used to pre-filter/pre-sort the sample. Materials\
    \ smaller than the size threshold are excluded from the sample\n  (type: float, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?(\
    \ *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **size_frac_up**\n  Mesh or pore size of the device used to\
    \ retain the sample. Materials larger than the size threshold are excluded from the sample.\n  (type: float, pattern:\
    \ `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **watering_regm**\
    \ [recommended]\n  Information about treatment involving an exposure to watering frequencies, treatment regimen including\
    \ how many times the treatment was repeated, how long each treatment lasted, and the start and end time of the entire\
    \ treatment; can include multiple regimens\n  (type: string)\n\n## mixs_section\n- **agrochem_addition**\n  Addition of\
    \ fertilizers, pesticides, etc. - amount and time of applications\n  (type: string, pattern: `^.*;[-+]?[0-9]*\\.?[0-9]+\
    \ ([^\\s-]{1,2}|[^\\s-]+.+[^\\s-]+);(\\d{4})(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01])(T([01]\\d|2[0-3]):([0-5]\\d)(:([0-5]\\\
    d))?(\\.\\d+)?(Z|([+-][01]\\d:[0-5]\\d))?)?)?)?$`)\n- **al_sat**\n  The relative abundance of aluminum in the sample\n\
    \  (type: float, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)?\
    \ *.*$`)\n- **al_sat_meth**\n  Reference or method used in determining Aluminum saturation\n  (type: string, pattern:\
    \ `^(PMID:\\d+|doi:10.\\d{2,9}/.*|https?:\\/\\/(?:www\\.)?[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\.[a-zA-Z0-9()]{1,6}\\b(?:[-a-zA-Z0-9()@:%_\\\
    +.~#?&\\/=]*))$`)\n- **annual_precpt**\n  The average of all annual precipitation values known, or an estimated equivalent\
    \ value derived by such methods as regional indexes or Isohyetal maps\n  (type: float, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?(\
    \ *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **annual_temp**\n  Mean annual temperature\n  (type: float,\
    \ pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **carb_nitro_ratio**\n\
    \  Ratio of amount or concentrations of carbon to nitrogen\n  (type: float)\n- **crop_rotation**\n  Whether or not crop\
    \ is rotated, and if yes, rotation schedule\n  (type: string)\n- **cur_land_use**\n  Present state of sample site\n  (type:\
    \ string)\n- **cur_vegetation**\n  Vegetation classification from one or more standard classification systems, or agricultural\
    \ crop\n  (type: string)\n- **cur_vegetation_meth**\n  Reference or method used in vegetation classification\n  (type:\
    \ string, pattern: `^(PMID:\\d+|doi:10.\\d{2,9}/.*|https?:\\/\\/(?:www\\.)?[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\.[a-zA-Z0-9()]{1,6}\\\
    b(?:[-a-zA-Z0-9()@:%_\\+.~#?&\\/=]*))$`)\n- **drainage_class**\n  Drainage classification from a standard system such\
    \ as the USDA system\n  (type: DrainageClassEnum)\n  Allowed values: excessively drained, moderately well, poorly, somewhat\
    \ poorly, very poorly, well\n- **experimental_factor**\n  Variable aspects of an experiment design that can be used to\
    \ describe an experiment, or set of experiments, in an increasingly detailed manner. This field accepts ontology terms\
    \ from Experimental Factor Ontology (EFO) and/or Ontology for Biomedical Investigations (OBI)\n  (type: string, pattern:\
    \ `^\\S+.*\\S+ \\[[a-zA-Z]{2,}:\\d+\\]$`)\n- **extreme_event**\n  Unusual physical events that may have affected microbial\
    \ populations\n  (type: string)\n- **fao_class**\n  Soil classification from the FAO World soil distribution from International\
    \ Soil Reference and Information Centre (ISRIC). The list of available soil classifications can be found at https://www.isric.org/explore/world-soil-distribution\n\
    \  (type: FaoClassEnum)\n  Allowed values: Acrisols, Alisols, Andosols, Anthrosols, Arenosols, Calcisols, Cambisols, Chernozems,\
    \ Cryosols, Durisols, Ferralsols, Fluvisols, Gleysols, Greyzems, Gypsisols, Histosols, Kastanozems, Lithosols, Leptosols,\
    \ Lixisols, Luvisols, Nitosols, Phaeozems, Planosols, Plinthosols, Podzols, Podzoluvisols, Rankers, Regosols, Rendzinas,\
    \ Solonchaks, Solonetz, Stagnosols, Technosols, Umbrisols, Vertisols, Yermosols\n- **fire**\n  Historical and/or physical\
    \ evidence of fire\n  (type: string, pattern: `^[12]\\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\\d|3[01]))?)?(\\\
    s+to\\s+[12]\\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\\d|3[01]))?)?)?$`)\n- **flooding**\n  Historical and/or\
    \ physical evidence of flooding\n  (type: string)\n- **heavy_metals**\n  Heavy metals present in the sample and their\
    \ concentrations.\n  (type: string)\n- **heavy_metals_meth**\n  Reference or method used in determining heavy metals\n\
    \  (type: string, pattern: `^(PMID:\\d+|doi:10.\\d{2,9}/.*|https?:\\/\\/(?:www\\.)?[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\.[a-zA-Z0-9()]{1,6}\\\
    b(?:[-a-zA-Z0-9()@:%_\\+.~#?&\\/=]*))$`)\n- **horizon_meth**\n  Reference or method used in determining the horizon\n\
    \  (type: string, pattern: `^(PMID:\\d+|doi:10.\\d{2,9}/.*|https?:\\/\\/(?:www\\.)?[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\.[a-zA-Z0-9()]{1,6}\\\
    b(?:[-a-zA-Z0-9()@:%_\\+.~#?&\\/=]*))$`)\n- **link_addit_analys**\n  Link to additional analysis results performed on\
    \ the sample\n  (type: string, pattern: `^(PMID:\\d+|doi:10.\\d{2,9}/.*|https?:\\/\\/(?:www\\.)?[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\\
    .[a-zA-Z0-9()]{1,6}\\b(?:[-a-zA-Z0-9()@:%_\\+.~#?&\\/=]*))$`)\n- **link_class_info**\n  Link to digitized soil maps or\
    \ other soil classification information\n  (type: string)\n- **link_climate_info**\n  Link to climate resource\n  (type:\
    \ string, pattern: `^(PMID:\\d+|doi:10.\\d{2,9}/.*|https?:\\/\\/(?:www\\.)?[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\.[a-zA-Z0-9()]{1,6}\\\
    b(?:[-a-zA-Z0-9()@:%_\\+.~#?&\\/=]*))$`)\n- **local_class**\n  Soil classification based on local soil classification\
    \ system\n  (type: string)\n- **local_class_meth**\n  Reference or method used in determining the local soil classification\n\
    \  (type: string, pattern: `^(PMID:\\d+|doi:10.\\d{2,9}/.*|https?:\\/\\/(?:www\\.)?[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\.[a-zA-Z0-9()]{1,6}\\\
    b(?:[-a-zA-Z0-9()@:%_\\+.~#?&\\/=]*))$`)\n- **micro_biomass_meth**\n  Reference or method used in determining microbial\
    \ biomass\n  (type: string)\n- **microbial_biomass**\n  The part of the organic matter in the soil that constitutes living\
    \ microorganisms smaller than 5-10 micrometer. If you keep this, you would need to have correction factors used for conversion\
    \ to the final units\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)?\
    \ *.*$`)\n- **org_matter**\n  Concentration of organic matter\n  (type: float, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?(\
    \ *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **org_nitro**\n  Concentration of organic nitrogen\n  (type:\
    \ float, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n\
    - **oxy_stat_samp**\n  Oxygenation status of sample\n  (type: OxyStatSampEnum)\n  Allowed values: aerobic, anaerobic,\
    \ other\n- **ph_meth**\n  Reference or method used in determining pH\n  (type: string)\n- **phosphate**\n  Concentration\
    \ of phosphate\n  (type: float, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)?\
    \ *.*$`)\n- **prev_land_use_meth**\n  Reference or method used in determining previous land use and dates\n  (type: string,\
    \ pattern: `^(PMID:\\d+|doi:10.\\d{2,9}/.*|https?:\\/\\/(?:www\\.)?[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\.[a-zA-Z0-9()]{1,6}\\\
    b(?:[-a-zA-Z0-9()@:%_\\+.~#?&\\/=]*))$`)\n- **previous_land_use**\n  Previous land use and dates\n  (type: string, pattern:\
    \ `^\\S+.*\\S+;([\\+-]?\\d{4}(?!\\d{2}\\b))((-?)((0[1-9]|1[0-2])(\\3([12]\\d|0[1-9]|3[01]))?|W([0-4]\\d|5[0-2])(-?[1-7])?|(00[1-9]|0[1-9]\\\
    d|[12]\\d{2}|3([0-5]\\d|6[1-6])))([T\\s]((([01]\\d|2[0-3])((:?)[0-5]\\d)?|24\\:?00)([\\.,]\\d+(?!:))?)?(\\17[0-5]\\d([\\\
    .,]\\d+)?)?([zZ]|([\\+-])([01]\\d|2[0-3]):?([0-5]\\d)?)?)?)?$`)\n- **profile_position**\n  Cross-sectional position in\
    \ the hillslope where sample was collected.sample area position in relation to surrounding areas\n  (type: ProfilePositionEnum)\n\
    \  Allowed values: backslope, footslope, shoulder, summit, toeslope\n- **salinity**\n  The total concentration of all\
    \ dissolved salts in a liquid or solid sample. While salinity can be measured by a complete chemical analysis, this method\
    \ is difficult and time consuming. More often, it is instead derived from the conductivity measurement. This is known\
    \ as practical salinity. These derivations compare the specific conductance of the sample to a salinity standard such\
