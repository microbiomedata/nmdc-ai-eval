- input: "Submission description: Aerobiome diversity is extensive, however species-level community structure remains poorly\
    \ resolved. Likewise, microbiomes of public transit systems are of public interest due to their importance for health,\
    \ though few studies have focused on these ecosystems whilst utilising shotgun metagenomics. Aerosol studies have focused\
    \ predominantly on individual cities, with limited between-city comparisons suggesting specific community structures.\
    \ Longitudinal studies show aerobiome diversity as dynamic, fluctuating during annual, seasonal and daily cycles, though\
    \ an interannual cycle remains to be considered. Further, a bacterial bias has limited fungal aerobiome studies, with\
    \ few considering both fractions collectively. As such, the objective of this study was to examine spatial and temporal\
    \ patterns in the species diversity of public transit aerobiomes, with an emphasis on bacteria and fungi. \nAir samples\
    \ taken over a three-year period (2017-2019) from six global cities were subjected to shotgun metagenomic sequencing.\
    \ Improved classification databases, notably for fungi, applying stringent parameters for trimming, exogenous contamination\
    \ removal and classification yielded high species-level resolution. Microbial diversity varied substantially among cities,\
    \ while human and environmental factors, recorded in parallel, were of secondary significance. Bacteria dominated the\
    \ public transit aerobiome with increased presence in cities with higher population densities. All aerobiomes had complex\
    \ compositions, consisting of hundreds to thousands of species. Interannual variation had limited significance on the\
    \ public transit aerobiome diversity and community structure.\nCities were the most important factor contributing to diversity\
    \ and community structure, demonstrating specific bacterial and fungal signatures. Further, a possible correlation between\
    \ geographical distance and ventilation method and the genetic signatures of aerobiomes is suggested. Bacteria are the\
    \ most abundant constituent of public transit aerobiomes, though no single species is globally dominant, conversely indicating\
    \ a large inter-city variation in community structure. The presence of a ubiquitous global species core is rejected, though\
    \ an aerobiome sub-core is confirmed. For the first time, local public transit aerobiome cores are presented for each\
    \ city and related to ecological niches. Further, the importance of a robust bioinformatics analysis pipeline to identify\
    \ and remove exogenous contaminants for studying low biomass samples is highlighted. Lastly, a core and sub-core definition\
    \ of contaminant aerobiome species with taxon tables, to facilitate future environmental studies, is presented.\nNotes:\
    \ \nStudy name: AI Example: Spatial and Temporal Patterns of Public Transit Aerobiomes\nProtocol descriptions: \nProtocol\
    \ names: \n\n--- NMDC Schema Context ---\n# AirInterface\n\nair dh_interface\n\nTotal fields: 35 | \nRequired: 3 | \n\
    Recommended: 5 | \nAncestors: DhMultiviewCommonColumnsMixin, SampIdNewTermsMixin, DhInterface\n\n## mixs_core_section\n\
    - **air_PM_concen**\n  Concentration of substances that remain suspended in the air, and comprise mixtures of organic\
    \ and inorganic substances (PM10 and PM2.5); can report multiple PM's by entering numeric values preceded by name of PM\n\
    \  (type: string, pattern: `^.*;[-+]?[0-9]*\\.?[0-9]+ ([^\\s-]{1,2}|[^\\s-]+.+[^\\s-]+)$`)\n- **barometric_press**\n \
    \ Force per unit area exerted against a surface by the weight of air above that surface\n  (type: float, pattern: `^[-+]?[0-9]*\\\
    .?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **carb_dioxide**\n  Carbon dioxide\
    \ (gas) amount or concentration at the time of sampling\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?(\
    \ *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **carb_monoxide**\n  Carbon monoxide (gas) amount or concentration\
    \ at the time of sampling\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)?\
    \ *.*$`)\n- **humidity**\n  Amount of water vapour in the air, at the time of sampling\n  (type: string, pattern: `^[-+]?[0-9]*\\\
    .?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **methane**\n  Methane (gas) amount\
    \ or concentration at the time of sampling\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *-\
    \ *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **organism_count**\n  Total cell count of any organism (or group\
    \ of organisms) per gram, volume or area of sample, should include name of organism followed by count. The method that\
    \ was used for the enumeration (e.g. qPCR, atp, mpn, etc.) Should also be provided. (example: total prokaryotes; 3.5e7\
    \ cells per ml; qpcr)\n  (type: string, pattern: `^(\\S+.*\\S+;[-+]?[0-9]*\\.?[0-9]+([eE][-+]?[0-9]+)? \\S+.*\\S+;(qPCR|ATP|MPN|other)\\\
    |)*(\\S+.*\\S+;[-+]?[0-9]*\\.?[0-9]+([eE][-+]?[0-9]+)? \\S+.*\\S+;(qPCR|ATP|MPN|other))$`)\n- **oxygen**\n  Oxygen (gas)\
    \ amount or concentration at the time of sampling\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?(\
    \ *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **perturbation**\n  Type of perturbation, e.g. chemical administration,\
    \ physical disturbance, etc., coupled with perturbation regimen including how many times the perturbation was repeated,\
    \ how long each perturbation lasted, and the start and end time of the entire perturbation period; can include multiple\
    \ perturbation types\n  (type: string)\n- **pollutants**\n  Pollutant types and, amount or concentrations measured at\
    \ the time of sampling; can report multiple pollutants by entering numeric values preceded by name of pollutant\n  (type:\
    \ string)\n- **samp_store_dur**\n  Duration for which the sample was stored. Indicate the duration for which the sample\
    \ was stored written in ISO 8601 format\n  (type: string, pattern: `^P(?:(?:\\d+D|\\d+M(?:\\d+D)?|\\d+Y(?:\\d+M(?:\\d+D)?)?)(?:T(?:\\\
    d+H(?:\\d+M(?:\\d+S)?)?|\\d+M(?:\\d+S)?|\\d+S))?|T(?:\\d+H(?:\\d+M(?:\\d+S)?)?|\\d+M(?:\\d+S)?|\\d+S)|\\d+W)$`)\n- **samp_store_loc**\n\
    \  Location at which sample was stored, usually name of a specific freezer/room\n  (type: string)\n- **size_frac**\n \
    \ Filtering pore size used in sample preparation\n  (type: string)\n- **solar_irradiance**\n  The amount of solar energy\
    \ that arrives at a specific area of a surface during a specific time interval\n  (type: string, pattern: `^[-+]?[0-9]*\\\
    .?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **ventilation_rate**\n  Ventilation\
    \ rate of the system in the sampled premises\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *-\
    \ *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **ventilation_type**\n  Ventilation system used in the sampled\
    \ premises\n  (type: string)\n- **volatile_org_comp**\n  Concentration of carbon-based chemicals that easily evaporate\
    \ at room temperature; can report multiple volatile organic compounds by entering numeric values preceded by name of compound\n\
    \  (type: string)\n- **wind_direction**\n  Wind direction is the direction from which a wind originates\n  (type: string)\n\
    - **wind_speed**\n  speed of wind measured at the time of sampling\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?(\
    \ *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n\n## mixs_modified_section\n- **alt** [recommended]\n  Heights\
    \ of objects such as airplanes, space shuttles, rockets, atmospheric balloons and heights of places such as atmospheric\
    \ layers and clouds. It is used to measure the height of an object which is above the earth's surface. In this context,\
    \ the altitude measurement is the vertical distance between the earth's surface above sea level and the sampled position\
    \ in the air\n  (type: float, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)?\
    \ *.*$`)\n- **chem_administration** [recommended]\n  List of chemical compounds administered to the host or site where\
    \ sampling occurred, and when (e.g. Antibiotics, n fertilizer, air filter); can include multiple compounds. For chemical\
    \ entities of biological interest ontology (chebi) (v 163), http://purl.bioontology.org/ontology/chebi\n  (type: string,\
    \ pattern: `^(\\S+.*\\S+ \\[[A-za-z]+:\\d+\\];[12]\\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\\d|3[01]))?)?\\|)*(\\\
    S+.*\\S+ \\[[A-za-z]+:\\d+\\];[12]\\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\\d|3[01]))?)?)$`)\n- **depth** [recommended]\n\
    \  The vertical distance below local surface. For sediment or soil samples depth is measured from sediment or soil surface,\
    \ respectively. Depth can be reported as an interval for subsurface samples\n  (type: string, pattern: `^[-+]?[0-9]*\\\
    .?[0-9]+(\\s*-\\s*[-+]?[0-9]*\\.?[0-9]+)?$`)\n- **samp_collec_device** [recommended]\n  The device used to collect an\
    \ environmental sample. This field accepts terms listed under environmental sampling device (http://purl.obolibrary.org/obo/ENVO).\
    \ This field also accepts terms listed under specimen collection device (http://purl.obolibrary.org/obo/GENEPIO_0002094)\n\
    \  (type: string)\n- **samp_collec_method**\n  The method employed for collecting the sample\n  (type: string)\n- **samp_mat_process**\n\
    \  A brief description of any processing applied to the sample during or after retrieving the sample from environment,\
    \ or a link to the relevant protocol(s) performed\n  (type: string)\n- **samp_size**\n  The total amount (volume or mass)\
    \ of sample collected.\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)?\
    \ *.*$`)\n\n## mixs_section\n- **experimental_factor**\n  Variable aspects of an experiment design that can be used to\
    \ describe an experiment, or set of experiments, in an increasingly detailed manner. This field accepts ontology terms\
    \ from Experimental Factor Ontology (EFO) and/or Ontology for Biomedical Investigations (OBI)\n  (type: string, pattern:\
    \ `^\\S+.*\\S+ \\[[a-zA-Z]{2,}:\\d+\\]$`)\n- **oxy_stat_samp**\n  Oxygenation status of sample\n  (type: OxyStatSampEnum)\n\
    \  Allowed values: aerobic, anaerobic, other\n- **salinity**\n  The total concentration of all dissolved salts in a liquid\
    \ or solid sample. While salinity can be measured by a complete chemical analysis, this method is difficult and time consuming.\
    \ More often, it is instead derived from the conductivity measurement. This is known as practical salinity. These derivations\
    \ compare the specific conductance of the sample to a salinity standard such as seawater\n  (type: string, pattern: `^[-+]?[0-9]*\\\
    .?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n- **temp**\n  Temperature of the\
    \ sample at the time of sampling\n  (type: float, pattern: `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?( *- *[-+]?[0-9]*\\\
    .?[0-9]+(?:[eE][-+]?[0-9]+)?)? *.*$`)\n\n## sample_id_section\n- **env_broad_scale**\n  In this field, report which major\
    \ environmental system your sample or specimen came from. The systems identified should have a coarse spatial grain, to\
    \ provide the general environmental context of where the sampling was done (e.g. were you in the desert or a rainforest?).\
    \ We recommend using subclasses of ENVO's biome class: http://purl.obolibrary.org/obo/ENVO_00000428. Format (one term):\
    \ termLabel [termID], Format (multiple terms): termLabel [termID]|termLabel [termID]|termLabel [termID]. Example: Annotating\
    \ a water sample from the photic zone in middle of the Atlantic Ocean, consider: oceanic epipelagic zone biome [ENVO:01000033].\
    \ Example: Annotating a sample from the Amazon rainforest consider: tropical moist broadleaf forest biome [ENVO:01000228].\
    \ If needed, request new terms on the ENVO tracker, identified here: http://www.obofoundry.org/ontology/envo.html\n  (type:\
    \ string, pattern: `^([^\\s-]{1,2}|[^\\s-]+.+[^\\s-]+) \\[ENVO:\\d{7,8}\\]$`)\n- **env_local_scale**\n  Report the entity\
    \ or entities which are in the sample or specimen s local vicinity and which you believe have significant causal influences\
    \ on your sample or specimen. We recommend using EnvO terms which are of smaller spatial grain than your entry for env_broad_scale.\
    \ Terms, such as anatomical sites, from other OBO Library ontologies which interoperate with EnvO (e.g. UBERON) are accepted\
    \ in this field. EnvO documentation about how to use the field: https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS\n\
    \  (type: string, pattern: `^([^\\s-]{1,2}|[^\\s-]+.+[^\\s-]+) \\[ENVO:\\d{7,8}\\]$`)\n- **env_medium**\n  Report the\
    \ environmental material(s) immediately surrounding the sample or specimen at the time of sampling. We recommend using\
    \ subclasses of 'environmental material' (http://purl.obolibrary.org/obo/ENVO_00010483). EnvO documentation about how\
    \ to use the field: https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS . Terms from other OBO ontologies\
    \ are permissible as long as they reference mass/volume nouns (e.g. air, water, blood) and not discrete, countable entities\
    \ (e.g. a tree, a leaf, a table top)\n  (type: string, pattern: `^([^\\s-]{1,2}|[^\\s-]+.+[^\\s-]+) \\[ENVO:\\d{7,8}\\\
    ]$`)\n- **sample_link** [recommended]\n  A unique identifier to assign parent-child, subsample, or sibling samples. This\
    \ is relevant when a sample or other material was used to generate the new sample.\n  (type: string, pattern: `[^\\:\\\
    n\\r]+\\:[^\\:\\n\\r]+`)\n- **source_mat_id**\n  A globally unique identifier assigned to the parent sample or sample\
    \ that is the source  of this sample.\n  (type: string, pattern: `^igsn:[a-zA-Z0-9]+|biosample:SAMN[a-zA-Z0-9]+|biosample:SAME[a-zA-Z0-9]+|biosample:SAMJ[a-zA-Z0-9]+|gold:Gb[0-9]+$`)\n\
    \nUtilize the provided information to inform your metadata field recommendations."
