    \ forest biome [ENVO:01000209], subtropical dry broadleaf forest biome [ENVO:01000225], subtropical grassland biome [ENVO:01000191],\
    \ subtropical moist broadleaf forest biome [ENVO:01000226], subtropical savanna biome [ENVO:01000187], subtropical shrubland\
