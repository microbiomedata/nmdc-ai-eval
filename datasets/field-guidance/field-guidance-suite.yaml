- input: "Submission description: We propose to sample the agricultural land use gradient at KBS Long Term Ecological Research\
    \ (LTER) site to understand how agricultural management affects soil molecular properties. Interactions between soil biological\
    \ and soil physical properties (including X-ray CT on intact soil) are a major gap in our understanding of soil health.\
    \ MONet measurements across our long-term gradient of land uses will help fill this gap, and advance our ability to link\
    \ soil measurements to management decisions (tillage, cover crops, perennials), and ecosystem service outcomes (soil health,\
    \ trace gas flux, soil carbon accumulation). Samples will come from 6 long-term treatments in KBSs Main Cropping Systems\
    \ Experiment (https://lter.kbs.msu.edu/research/long-term-experiments/main-cropping-system-experiment/), oriented along\
    \ a land use intensity gradient: four treatments in row crop agriculture, corn-soy-wheat rotation: 1) Conventional with\
    \ tillage, 2) No-tillage 3) Reduced input (1/3 of chemical inputs), with cover crops 4) Organic, with no chemical inputs\
    \ and cover crops. There are also two successional plant communities, 5) Early successional grassland, and 6) Deciduous\
    \ forest, both of which will serve as references to row crop agriculture. Because of high spatial variation in early successional\
    \ grassland (high plant diversity), we will sample an additional plot (N=5) in this treatment. This will not exceed 24\
    \ samples because forest plots have only 3 field replicates. The KBS LTER is funded by NSF through 2028 and has adequate\
    \ resources and personnel to collect/ship samples and publish results. Previous and current data on soils, climate, and\
    \ ecosystem services generated by the KBS LTER (https://lter.kbs.msu.edu/datatables) will increase the impact of this\
    \ work. For instance, no-till treatments have accumulated greater soil organic matter than conventional tilled treatments\
    \ and have greater water holding capacity. Micro-scale molecular measurements may inform mechanisms. While various soil\
    \ pore and amplicon sequencing data have been generated on 1-2 treatments at a time, there has been no previous study\
    \ characterizing more than two treatments in the gradient at a time, with both structural and biological data. Such data\
    \ will help us understand how variation in these properties links to soil function and ecosystem services. The long-term\
    \ (35 year) nature of these treatments, in addition to the existing resources and datasets, make this a unique opportunity.\n\
    Notes: \nStudy name: AI example: Investigating the effect of agriculture and fire on soil molecular properties\nProtocol\
    \ descriptions: \nProtocol names: \n\n--- NMDC Schema Context ---\n# SoilInterface\n\nsoil dh_interface\n\nTotal fields:\
    \ 100 | \nRequired: 3 | \nRecommended: 20 | \nAncestors: DhMultiviewCommonColumnsMixin, SampIdNewTermsMixin, SoilMixsInspiredMixin,\
    \ DhInterface\n\n## mixs_inspired_section\n- **ammonium_nitrogen**\n  Concentration of ammonium nitrogen in the sample\n\
    \  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+ +(\\[ppm\\]|mg/kg|mg/L)$`)\n- **bulk_elect_conductivity**\n  Electrical\
    \ conductivity is a measure of the ability to carry electric current, which is mostly dictated by the chemistry of and\
    \ amount of water.\n  (type: float)\n- **collection_time** [recommended]\n  The time of sampling, either as an instance\
    \ (single point) or interval.\n  (type: string, pattern: `^([01]?\\d|2[0-3]|24(?=:00?:00?$)):([0-5]\\d)(:([0-5]\\d))?$`)\n\
    - **collection_time_inc** [recommended]\n  Time the incubation was harvested/collected/ended. Only relevant for incubation\
    \ samples.\n  (type: string, pattern: `^([01]?\\d|2[0-3]|24(?=:00?:00?$)):([0-5]\\d)(:([0-5]\\d))?$`)\n- **experimental_factor_other**\
    \ [recommended]\n  Other details about your sample that you feel can't be accurately represented in the available columns.\n\
    \  (type: string)\n- **filter_method** [recommended]\n  Type of filter used or how the sample was filtered\n  (type: string)\n\
    - **infiltrations**\n  The amount of time it takes to complete each infiltration activity\n  (type: string, pattern: `^(?:(?:[0-9]|[1-9][0-9]|9[0-9]|0[0-9]|0[0-5][0-9]):[0-5][0-9]:[0-5][0-9])(?:;(?:[0-9]|[1-9][0-9]|9[0-9]|0[0-9]|0[0-5][0-9]):[0-5][0-9]:[0-5][0-9])*$`)\n\
    - **isotope_exposure** [recommended]\n  List isotope exposure or addition applied to your sample.\n  (type: string)\n\
    - **lbc_thirty**\n  lime buffer capacity, determined after 30 minute incubation\n  (type: float)\n- **lbceq**\n  lime\
    \ buffer capacity, determined at equilibrium after 5 day incubation\n  (type: float)\n- **manganese**\n  Concentration\
    \ of manganese in the sample\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+ +(\\[ppm\\]|mg/kg|mg/L)$`)\n- **micro_biomass_c_meth**\
    \ [recommended]\n  Reference or method used in determining microbial biomass carbon\n  (type: string)\n- **micro_biomass_n_meth**\n\
    \  Reference or method used in determining microbial biomass nitrogen\n  (type: string)\n- **microbial_biomass_c**\n \
    \ The part of the organic matter in the soil that constitutes living microorganisms smaller than 5-10 micrometer.\n  (type:\
    \ string, pattern: `^[-+]?[0-9]*\\.?[0-9]+ .*$`)\n- **microbial_biomass_n**\n  The part of the organic matter in the soil\
    \ that constitutes living microorganisms smaller than 5-10 micrometer.\n  (type: string, pattern: `^[-+]?[0-9]*\\.?[0-9]+\
    \ .*$`)\n- **nitrate_nitrogen**\n  Concentration of nitrate nitrogen in the sample\n  (type: string, pattern: `^[-+]?[0-9]*\\\
    .?[0-9]+ +(\\[ppm\\]|mg/kg|mg/L)$`)\n- **nitrite_nitrogen**\n  Concentration of nitrite nitrogen in the sample\n  (type:\
    \ string, pattern: `^[-+]?[0-9]*\\.?[0-9]+ +(\\[ppm\\]|mg/kg|mg/L)$`)\n- **non_microb_biomass**\n  Amount of biomass;\
    \ should include the name for the part of biomass measured, e.g.insect, plant, total. Can include multiple measurements\
    \ separated by ;\n  (type: string, pattern: `^([^;\\t\\r\\x0A]+;[-+]?[0-9]*\\.?[0-9]+([eE][-+]?[0-9]+)? [^;\\t\\r\\x0A]+\\\
    |)*([^;\\t\\r\\x0A]+;[-+]?[0-9]*\\.?[0-9]+([eE][-+]?[0-9]+)? [^;\\t\\r\\x0A]+)$`)\n- **non_microb_biomass_method**\n \
    \ Reference or method used in determining biomass\n  (type: string)\n- **org_nitro_method**\n  Method used for obtaining\
    \ organic nitrogen\n  (type: string)\n- **other_treatment** [recommended]\n  Other treatments applied to your samples\
    \ that are not applicable to the provided fields\n  (type: string)\n- **start_date_inc** [recommended]\n  Date the incubation\
    \ was started. Only relevant for incubation samples.\n  (type: string, pattern: `^[12]\\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\\\
    d|3[01]))?)?$`)\n- **start_time_inc** [recommended]\n  Time the incubation was started. Only relevant for incubation samples.\n\
    \  (type: string, pattern: `^([01]?\\d|2[0-3]|24(?=:00?:00?$)):([0-5]\\d)(:([0-5]\\d))?$`)\n- **zinc**\n  Concentration\
