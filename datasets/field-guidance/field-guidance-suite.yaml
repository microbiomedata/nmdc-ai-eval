- input: "Submission description: Over the past 150 years, the tallgrass prairie biome of central North America has been rapidly\
    \ replaced by annual cropping systems, transforming the region into one of the world's most productive grain areas. The\
    \ productivity of this region is in large part attributed to the nutrient rich soil organic matter (SOM) that accumulated\
    \ from millenia of prairie growth. However, much of this native SOM has been lost over the last 150 years, raising concerns\
    \ about the sustainability of current agricultural practices. This study aims to address two core questions: how has the\
    \ conversion of the tallgrass prairie biome to corn-based cropping systems in the US Midwest affected 1) soil hydrobiogeochemical\
    \ functioning, including at depths beyond the typical sampling depth of 15 cm and 2) soil organic matter content, form,\
    \ source (i.e., prairie vs crop) and age? The proposed project will link long-term agricultural management practices (spanning\
    \ 149 years at the proposed 2025 sampling) and hydrobiogeochemical functions above and below the typical plow layer (15\
    \ cm) at macro and microscales. To this end, we will sample soils from long-term (year 149 in 2025) treatments at the\
    \ Morrow Plots (University of Illinois Urbana-Champaign), established in 1876 when tallgrass prairies were in the final\
    \ stage of conversion to agriculture in what is now the Corn Belt. Duplicate soil columns (8 cm x 60 cm) will be collected\
    \ from each treatment replicate and X-ray computed tomography at EMSL will be used to visualize soil structure and large\
    \ (>2 mm) organic matter. The columns will be broken up and <1 cm aggregates will be stained with Os and imaged by X-ray\
    \ microcomputed tomography at APS, then sliced and imaged by scanning electron microscopy energy dispersive x-ray spectroscopy\
    \ (SEM-EDS) at EMSL. The resulting images will be used to train neural networks to evaluate particulate organic matter\
    \ (POM) distribution in soil aggregates, an important driver of nutrient cycling. Results will be used to estimate potential\
    \ for POM mineralization throughout the larger column. Simultaneously, a second core will be collected from each treatment\
    \ replicate, sectioned, sieved, and flash frozen. Microbial community composition and function will be evaluated using\
    \ a concerted suite of measurements at EMSL and JGI: metagenomics, metabolomics, proteomics, and lipidomics. To characterize\
    \ SOM and related biogeochemical functions (e.g., nutrient storage and provisioning), total carbon (C), nitrogen (N) and\
    \ phosphorus (P), extractable N and P, and activities of oxidative and hydrolytic enzymes that catalyze SOM depolymerization-mineralization.\
    \ Finally, to quantify the SOM derived from tallgrass prairie (largely C3) versus corn (C4), we will measure δ13C of bulk\
    \ soil, POM, and mineral associated organic carbon (MAOM) fractions, and employ 14C dating to estimate SOM age The results\
    \ of this work will inform our understanding of how the legacy of the tallgrass prairie biome of central North America\
    \ and the current US Corn Belt influences soil hydrobiogeochemical function and soil carbon stability today. Specifically,\
    \ we will test the hypothesis that corn-based cropping following abrupt conversion of prairies in the late 1800s is in\
    \ part supported by remnant SOM from prairies, which will vary in extent (e.g., magnitude of prairie-derived SOM pool\
    \ size and potential mineralization of nutrients) and by depth depending on management practices. Our work will connect\
    \ micro-scale processes (POM mineralization, MAOM formation, microbial function) occurring at the aggregate level with\
    \ bulk processes (gas/water flow from soil surface to depth) to constrain predictions on organic matter mineralization,\
    \ stabilization, and soil function in the US Corn Belt, a critical agricultural region for the US economy and global grain\
    \ supply.\nNotes: \nStudy name: AI Example: Long term crop rotations alter soil function and prairie carbon dynamics to\
    \ depth in midwestern cropping systems\nProtocol descriptions: \nProtocol names: \n\n--- NMDC Schema Context ---\n# SoilInterface\n\
    \nsoil dh_interface\n\nTotal fields: 100 | \nRequired: 3 | \nRecommended: 20 | \nAncestors: DhMultiviewCommonColumnsMixin,\
    \ SampIdNewTermsMixin, SoilMixsInspiredMixin, DhInterface\n\n## mixs_inspired_section\n- **ammonium_nitrogen**\n  Concentration\
