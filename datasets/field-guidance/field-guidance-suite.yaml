- input: "Submission description: Sampling on the Umpqua National Forest will allow land managers to assess the effects of\
    \ severe wildfire and postfire management on soil physical, chemical, and biological properties that the Forest Service\
    \ could not otherwise measure. We will compare properties in severely burned soils within and outside salvage logging\
    \ units, and in areas with low or no soil burn severity. Understanding which properties changed in our local burned soils,\
    \ and by how much, will help National Forest soil scientists and silviculturists refine best management practices for\
    \ burned soils. The results of this work could affect the amount of organic material retained or added to burned areas\
    \ following future fires, for example, with the goals of helping soil microbial communities and organic matter recover\
    \ and minimizing structural changes and erosion.The sampling sites are already being monitored for visible signs of erosion,\
    \ but more information is needed to understand how severely the chemical and biological soil properties were impacted\
    \ in areas mapped as high soil burn severity in postfire rapid assessment. Also, federal staff and public land users are\
    \ increasingly interested in potential impacts of land management on soil microbial communities, and MONet analyses will\
    \ provide the first microbial community data on the Umpqua National Forest to form a baseline for discussing potential\
    \ impacts. Data from recently burned soils will also help the MONet dataset represent a prevalent disturbance in forest\
    \ soils and support including wildfire impacts in soil process models. Fire effects are an important component of all\
    \ ecological processes in the extensive seasonally dry forests of western North America and similar biomes worldwide.\n\
