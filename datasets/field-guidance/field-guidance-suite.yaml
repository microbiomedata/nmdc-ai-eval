    \ `^[-+]?[0-9]*\\.?[0-9]+(?:[eE][-+]?[0-9]+)?%? \\S.+$`)\n\n## sample_id_section\n- **env_broad_scale**\n  In this field,\
    \ report which major environmental system your sample or specimen came from. The systems identified should have a coarse\
    \ spatial grain, to provide the general environmental context of where the sampling was done (e.g. were you in the desert\
