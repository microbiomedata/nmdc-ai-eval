# CBORG (LBL's OpenAI-compatible proxy) model aliases for the llm tool.
#
# `just setup-cborg` merges these into extra-openai-models.yaml in llm's user directory
# (the directory `uv run llm keys path` prints) and stores CBORG_API_KEY from .env in the
# llm key store as `cborg`. After that, any cborg/* name below works in a suite run.
# Full catalog: `just probe-tiers --list-cborg-models`. See docs/auth.md.
#
# Caution: CBORG cuts off all models once a user without a project ID reaches the $50 cap.
- model_id: cborg/gpt-4o-mini
  model_name: gpt-4o-mini
  api_base: https://api.cborg.lbl.gov/v1
  api_key_name: cborg
- model_id: cborg/gpt-4.1-mini
  model_name: gpt-4.1-mini
  api_base: https://api.cborg.lbl.gov/v1
  api_key_name: cborg
- model_id: cborg/gpt-5-mini
