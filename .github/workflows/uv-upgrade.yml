name: Weekly dependency upgrade

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 7am UTC
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Everything except the AI and agent packages in .github/held-packages.txt, which move
      # only in their own PR with an eval run before and after (docs/dependency-upgrades.md).
      - name: Upgrade dependencies except held AI packages
        run: python3 scripts/upgrade_except_held.py

      - name: Open PR if lockfile changed
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: upgrade dependencies except held AI packages"
          branch: chore/uv-upgrade
          delete-branch: true
          title: "chore: weekly dependency upgrade"
          body: |
            Automated weekly upgrade of every locked package except the AI and agent
            packages in `.github/held-packages.txt`, which stay put so eval scores do not
            move with library versions (see `docs/dependency-upgrades.md`). Auto-merges when
            CI passes (branch protection catches any regression).

            Check the Security tab after merging — Dependabot alerts for packages
            bumped here will auto-close once the new versions land on main.
          labels: dependencies

      - name: Enable auto-merge on the PR
        if: steps.create-pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "$PR_NUM"
        env:
          PR_NUM: ${{ steps.create-pr.outputs.pull-request-number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
