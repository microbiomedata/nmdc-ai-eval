name: Dependency audit

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch:        # on-demand from the Actions tab

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync --dev
      # Keep this ignore list in sync with the `audit` recipe in the justfile.
      # PYSEC-2026-3447: setuptools<82 is forced by oaklib; see the justfile for why
      # this repo is not exposed, and INCATools/ontology-access-kit#852 upstream.
      - name: pip-audit
        run: uv run pip-audit --ignore-vuln CVE-2025-69872 --ignore-vuln CVE-2026-4539 --ignore-vuln PYSEC-2026-3447
